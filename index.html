<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PVQC 隨身刷題</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; color: #333; margin: 0; padding: 15px; text-align: center; -webkit-tap-highlight-color: transparent; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        
        h1 { font-size: 1.4rem; color: #2c3e50; margin: 10px 0 15px 0; }
        textarea { width: 100%; height: 100px; border: 2px solid #eee; border-radius: 12px; padding: 12px; font-size: 14px; box-sizing: border-box; -webkit-appearance: none; }
        textarea:focus { border-color: #3498db; outline: none; }
        
        .log-area { font-size: 0.85rem; color: #e74c3c; text-align: left; background: #fff5f5; padding: 8px; border-radius: 6px; margin-top: 10px; display: none; }

        /* ======== 首頁測驗按鈕排版 ======== 
           目前設定為 1fr 1fr (代表 2 行，會變成 2x3 的排列)。
           如果你想改：
           - 一整排 (1x6)：請改成 grid-template-columns: 1fr;
           - 3x2 排列：請改成 grid-template-columns: 1fr 1fr 1fr;
        */
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        
        .btn { padding: 16px 8px; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; color: white; transition: all 0.1s; display: flex; align-items: center; justify-content: center;}
        .btn:active { transform: scale(0.97); }
        
        .btn-t1 { background: linear-gradient(135deg, #ff7675, #d63031); }
        .btn-t2 { background: linear-gradient(135deg, #74b9ff, #0984e3); }
        .btn-t3 { background: linear-gradient(135deg, #ffeaa7, #fdcb6e); color: #444; }
        .btn-t4 { background: linear-gradient(135deg, #a29bfe, #6c5ce7); }
        .btn-t5 { background: linear-gradient(135deg, #55efc4, #00b894); color: #2d3436; }
        .btn-t6 { background: linear-gradient(135deg, #81ecec, #00cec9); color: #2d3436; }
        
        .btn-submit { background: #2d3436; margin-top: 15px; width: 100%; font-size: 18px; padding: 16px;}
        .btn-back { background: #636e72; margin-top: 30px; width: 100%; grid-column: 1 / -1;}

        .hidden { display: none !important; }
        
        .stat-bar { display: flex; justify-content: space-between; color: #636e72; font-size: 0.9rem; margin-bottom: 20px; font-weight: bold; }
        .question-box { min-height: 80px; display: flex; align-items: center; justify-content: center; flex-direction: column; font-size: 1.8rem; font-weight: bold; color: #2d3436; margin: 10px 0 20px; word-break: break-word; }
        .question-sub { font-size: 1rem; color: #b2bec3; font-weight: normal; margin-top: 5px; }
        
        input[type="text"] { width: 100%; padding: 15px; font-size: 20px; border: 2px solid #dfe6e9; border-radius: 10px; text-align: center; box-sizing: border-box; -webkit-appearance: none; }
        input[type="text"]:focus { border-color: #3498db; }

        /* ======== 測驗中的選項排版 (恢復從上到下) ======== */
        #area-choice { display: flex; flex-direction: column; gap: 10px; width: 100%; }
        
        .option-btn { background: #fff; border: 2px solid #f1f2f6; width: 100%; min-height: 60px; padding: 15px; border-radius: 10px; font-size: 1.1rem; color: #2d3436; text-align: left; font-weight: 500; transition: all 0.2s; word-break: break-word;}
        .option-btn.selected { border-color: #0984e3; background: #e3f2fd; transform: scale(1.02); box-shadow: 0 4px 10px rgba(9, 132, 227, 0.2); }
        .option-btn.correct { background: #00b894; color: white; border-color: #00b894; }
        .option-btn.wrong { background: #ff7675; color: white; border-color: #ff7675; }
        .evil-font { font-family: 'Courier New', Courier, monospace; font-size: 1.25rem; font-weight: bold; letter-spacing: 0.5px; }
        
        #spell-feedback { height: 35px; margin-top: 10px; font-weight: bold; font-size: 1.5rem; display: flex; align-items: center; justify-content: center;}
    </style>
</head>
<body>

<div class="container" id="setup-screen">
    <h1>PVQC</h1>
    <textarea id="vocab-input" placeholder="請貼上單字..."></textarea>
    <div id="parse-log" class="log-area"></div>

    <div class="btn-grid">
        <button class="btn btn-t1" onclick="startMode('spell')">測驗一：看中拼英</button>
        <button class="btn btn-t2" onclick="startMode('read_choice')">測驗二：看英選中</button>
        <button class="btn btn-t3" onclick="startMode('listen_choice')">測驗三：聽英選中</button>
        <button class="btn btn-t4" onclick="startMode('listen_spell')">測驗四：聽音選英</button>
        <button class="btn btn-t5" onclick="startMode('zh_to_audio')">測驗五：看中選音</button>
        <button class="btn btn-t6" onclick="startMode('en_to_audio')">測驗六：看英選音</button>
    </div>
</div>

<div class="container hidden" id="game-screen">
    <div class="stat-bar">
        <span id="mode-badge">訓練模式</span>
        <span>剩餘: <span id="q-left">0</span></span>
    </div>

    <div id="q-display" class="question-box"></div>

    <div id="area-spell" class="hidden">
        <input type="text" id="ans-input" placeholder="輸入英文..." autocomplete="off" spellcheck="false" autocapitalize="off">
        <div id="spell-feedback"></div>
        <button class="btn btn-submit" onclick="checkSpell()">送出</button>
    </div>

    <div id="area-choice" class="hidden"></div>
    
    <button id="btn-audio-submit" class="btn btn-submit hidden" onclick="submitAudioChoice()">確定送出</button>

    <button class="btn btn-back" onclick="goBack()">返回首頁</button>
</div>

<script>
    let vocabList = [];
    let pool = [];
    let current = null;
    let mode = '';
    let isLocked = false;
    let synth = window.speechSynthesis;
    let selectedOpt = null;
    let selectedBtnObj = null;

    function generateEvilDistractors(correctWord) {
        let distractors = new Set();
        let word = correctWord;
        let lowerWord = word.toLowerCase();
        const replaceAt = (str, index, char) => str.substring(0, index) + char + str.substring(index + 1);

        const visualMap = { 'i': 'l', 'l': 'i', 'm': 'n', 'n': 'm', 'e': 'c', 'c': 'e', 'u': 'v', 'v': 'u' };
        for (let i = 0; i < lowerWord.length; i++) {
            let char = lowerWord[i];
            if (visualMap[char]) distractors.add(replaceAt(word, i, (word[i] === word[i].toUpperCase()) ? visualMap[char].toUpperCase() : visualMap[char]));
        }

        const vowels = ['a', 'e', 'i', 'o', 'u'];
        for (let i = 0; i < lowerWord.length; i++) {
            if (vowels.includes(lowerWord[i])) {
                let randomVowel = vowels[Math.floor(Math.random() * vowels.length)];
                if (randomVowel !== lowerWord[i]) distractors.add(replaceAt(word, i, (word[i] === word[i].toUpperCase()) ? randomVowel.toUpperCase() : randomVowel));
            }
        }

        for (let i = 0; i < word.length - 1; i++) {
            if (lowerWord[i] !== lowerWord[i+1] && lowerWord[i] !== ' ' && lowerWord[i+1] !== ' ') {
                let chars = word.split('');
                let temp = chars[i]; chars[i] = chars[i+1]; chars[i+1] = temp;
                distractors.add(chars.join(''));
            }
        }

        distractors.delete(word);
        distractors.delete(lowerWord);

        const alphabet = "abcdefghijklmnopqrstuvwxyz";
        let attempts = 0;
        while (distractors.size < 3 && attempts < 50) {
            attempts++;
            let randIndex = Math.floor(Math.random() * word.length);
            if (word[randIndex] === ' ' || word[randIndex] === '-') continue;
            let randChar = alphabet[Math.floor(Math.random() * alphabet.length)];
            let fake = replaceAt(word, randIndex, (word[randIndex] === word[randIndex].toUpperCase()) ? randChar.toUpperCase() : randChar);
            if (fake.toLowerCase() !== lowerWord) distractors.add(fake);
        }

        let result = Array.from(distractors);
        for (let i = result.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [result[i], result[j]] = [result[j], result[i]];
        }
        return result.slice(0, 3);
    }

    function parseVocab() {
        const raw = document.getElementById('vocab-input').value.trim();
        const logArea = document.getElementById('parse-log');
        logArea.style.display = 'none'; logArea.innerHTML = '';

        if(!raw) return alert("請先貼上單字！");

        let lines = raw.split('\n').map(l => l.trim()).filter(l => l);
        let parsed = []; let errorLines = [];
        
        for (let i = 0; i < lines.length; i++) {
            let line = lines[i];
            let hasZh = /[^\x00-\x7F]/.test(line); let hasEn = /[a-zA-Z]/.test(line);

            if (hasZh && hasEn) {
                let match = line.match(/[^\x00-\x7F]/);
                let splitIdx = match ? match.index : -1;
                if (splitIdx > 0) {
                    parsed.push({ en: line.slice(0, splitIdx).trim().replace(/,$/, ''), zh: line.slice(splitIdx).trim() });
                    continue;
                }
            }
            if (i + 1 < lines.length) {
                let next = lines[i+1];
                if (hasEn && !hasZh && /[^\x00-\x7F]/.test(next)) {
                    parsed.push({ en: line, zh: next }); i++; continue;
                }
            }
            errorLines.push(`略過: ${line.substring(0, 10)}...`);
        }
        
        vocabList = parsed;
        if (errorLines.length > 0) {
            logArea.style.display = 'block';
            logArea.innerHTML = `成功讀取 ${parsed.length} 個。`;
            if (parsed.length === 0) { alert("完全讀取失敗，請檢查格式"); return false; }
        } else if (parsed.length === 0) { alert("讀取失敗"); return false; }
        return true;
    }

    function startMode(m) {
        if(!parseVocab()) return;
        mode = m; pool = [...vocabList]; shuffle(pool);

        document.getElementById('setup-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        
        const titles = { 
            'spell': '測驗一：看中拼英', 'read_choice': '測驗二：看英選中', 'listen_choice': '測驗三：聽英選中', 
            'listen_spell': '測驗四：聽音選英', 'zh_to_audio': '測驗五：看中選音', 'en_to_audio': '測驗六：看英選音' 
        };
        document.getElementById('mode-badge').innerText = titles[mode];
        nextQuestion();
    }

    function nextQuestion() {
        isLocked = false;
        selectedOpt = null; selectedBtnObj = null;
        document.getElementById('btn-audio-submit').classList.add('hidden');
        
        if(pool.length === 0) { alert("這組練完囉！"); return goBack(); }

        current = pool.pop();
        document.getElementById('q-left').innerText = pool.length + 1;
        
        const display = document.getElementById('q-display');
        const areaSpell = document.getElementById('area-spell');
        const areaChoice = document.getElementById('area-choice');
        
        areaSpell.classList.add('hidden'); areaChoice.classList.add('hidden');
        document.getElementById('spell-feedback').innerHTML = '';
        document.getElementById('ans-input').value = '';

        if(mode === 'spell') {
            display.innerHTML = current.zh + ' <span style="font-size:1.5rem; cursor:pointer;" onclick="speak(\''+current.en+'\')">🔊</span>';
            areaSpell.classList.remove('hidden');
            setTimeout(()=>document.getElementById('ans-input').focus(), 100);
        } else if(mode === 'read_choice') {
            display.innerHTML = current.en + ' <span style="font-size:1.5rem; cursor:pointer;" onclick="speak(\''+current.en+'\')">🔊</span>';
            areaChoice.classList.remove('hidden'); renderChoices();
        } else if(mode === 'zh_to_audio') {
            display.innerHTML = `${current.zh}<div class="question-sub">請聽發音選出正確選項</div>`;
            areaChoice.classList.remove('hidden'); renderChoices();
        } else if(mode === 'en_to_audio') {
            display.innerHTML = `${current.en}<div class="question-sub">請聽發音選出正確選項</div>`;
            areaChoice.classList.remove('hidden'); renderChoices();
        } else {
            display.innerHTML = '<span style="font-size:3.5rem; cursor:pointer;" onclick="speak(\''+current.en+'\')">🔊</span><div class="question-sub">點擊喇叭重聽</div>';
            areaChoice.classList.remove('hidden'); renderChoices();
            setTimeout(() => speak(current.en), 300);
        }
    }

    function checkSpell() {
        if(isLocked) return;
        const val = document.getElementById('ans-input').value.trim();
        const fb = document.getElementById('spell-feedback');

        if(val.toLowerCase() === current.en.toLowerCase()) {
            isLocked = true; 
            fb.innerHTML = '<span style="color:#00b894">O</span>';
            setTimeout(nextQuestion, 600);
        } else {
            // 點擊 X 會跳出正確答案
            fb.innerHTML = `<span style="color:#ff7675; cursor:pointer;" onclick="alert('${current.en}')">X</span>`;
            document.getElementById('ans-input').select();
        }
    }

    function renderChoices() {
        const div = document.getElementById('area-choice'); div.innerHTML = '';
        let finalOptions = [];
        let isAudioMode = (mode === 'zh_to_audio' || mode === 'en_to_audio');

        if (mode === 'listen_spell') {
            let fakeWords = generateEvilDistractors(current.en);
            finalOptions = fakeWords.map(word => ({ text: word, isCorrect: false }));
            finalOptions.push({ text: current.en, isCorrect: true });
        } else {
            let distractors = vocabList.filter(v => v.en !== current.en);
            if (distractors.length === 0) distractors = [...vocabList]; 
            shuffle(distractors);
            
            let fakeOptions = distractors.slice(0, 3);
            finalOptions = fakeOptions.map(opt => ({ 
                text: isAudioMode ? opt.en : opt.zh, 
                fullData: opt, isCorrect: false 
            }));
            finalOptions.push({ text: isAudioMode ? current.en : current.zh, fullData: current, isCorrect: true });
            
            while(finalOptions.length < 4 && vocabList.length >= 4) {
                finalOptions.push({ text: isAudioMode ? distractors[0].en : distractors[0].zh, fullData: distractors[0], isCorrect: false });
            }
        }

        shuffle(finalOptions); 

        finalOptions.forEach((opt, idx) => {
            let btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.optData = opt; 

            if (isAudioMode) {
                btn.innerText = `🔊 選項 ${String.fromCharCode(65 + idx)}`;
                btn.onclick = () => {
                    if (isLocked) return;
                    speak(opt.text);
                    document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    selectedOpt = opt; selectedBtnObj = btn;
                    document.getElementById('btn-audio-submit').classList.remove('hidden');
                };
            } else {
                btn.innerText = opt.text; 
                if (mode === 'listen_spell') btn.classList.add('evil-font');
                
                btn.onclick = () => {
                    if(isLocked) return;
                    if(opt.isCorrect) {
                        isLocked = true; btn.classList.add('correct');
                        setTimeout(nextQuestion, 500);
                    } else {
                        btn.classList.add('wrong'); btn.style.opacity = '0.6';
                    }
                };
            }
            div.appendChild(btn);
        });
    }

    function submitAudioChoice() {
        if (isLocked || !selectedOpt || !selectedBtnObj) return;
        isLocked = true;
        document.getElementById('btn-audio-submit').classList.add('hidden');

        document.querySelectorAll('.option-btn').forEach(b => {
            let opt = b.optData;
            b.classList.remove('selected');
            if (opt.isCorrect) {
                b.classList.add('correct');
                b.innerText = `O ${opt.text} (${opt.fullData.zh})`;
            } else if (b === selectedBtnObj) {
                b.classList.add('wrong');
                b.innerText = `X ${opt.text} (${opt.fullData.zh})`;
            } else {
                b.innerText = `${opt.text}`;
            }
        });

        if (selectedOpt.isCorrect) {
            setTimeout(nextQuestion, 1200); 
        } else {
            let nextBtn = document.getElementById('btn-audio-submit');
            nextBtn.innerText = "繼續下一題";
            nextBtn.onclick = () => {
                nextBtn.innerText = "確定送出";
                nextBtn.onclick = submitAudioChoice; 
                nextQuestion();
            };
            nextBtn.classList.remove('hidden');
        }
    }

    function speak(text) {
        if(!text) return;
        synth.cancel(); 
        let txt = text.replace(/\(.*\)/, '');
        let u = new SpeechSynthesisUtterance(txt);
        u.lang = 'en-US'; 
        synth.speak(u);
    }

    function shuffle(arr) {
        for(let i=arr.length-1; i>0; i--) {
            let j = Math.floor(Math.random()*(i+1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
    }

    function goBack() {
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('setup-screen').classList.remove('hidden');
    }

    document.getElementById('ans-input').addEventListener('keypress', (e)=>{
        if(e.key === 'Enter') checkSpell();
    });
</script>
</body>
</html>
